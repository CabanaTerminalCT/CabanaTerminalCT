<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="CabanaTerminal">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.55"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2b0d" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d2b0d" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="#000500"/>

  <g filter="url(#glow)" fill="none" stroke="#33ff33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.82;0.97;0.9" dur="3.2s" repeatCount="indefinite"/>

      <path d="M330 60 C330 24 372 4 420 4 C468 4 510 24 510 60
               C510 86 500 104 500 120 C500 138 512 146 512 164
               C512 182 498 190 484 192 L484 214 C484 224 476 230 466 230
               L374 230 C364 230 356 224 356 214 L356 192
               C342 190 328 182 328 164 C328 146 340 138 340 120
               C340 104 330 86 330 60 Z"/>

      <ellipse cx="392" cy="112" rx="34" ry="30" fill="#000500">
        <animate attributeName="ry" values="30;30;1;30;30" keyTimes="0;0.86;0.9;0.94;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="448" cy="112" rx="34" ry="30" fill="#000500">
        <animate attributeName="ry" values="30;30;1;30;30" keyTimes="0;0.86;0.9;0.94;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="392" cy="112" r="6" fill="#33ff33" stroke="none">
        <animate attributeName="r" values="6;7;6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="448" cy="112" r="6" fill="#33ff33" stroke="none">
        <animate attributeName="r" values="6;7;6" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <path d="M420 132 L410 156 L430 156 Z" fill="#000500" stroke-width="2.5"/>

      <path d="M378 176 L462 176" stroke-width="2.5"/>
      <path d="M396 176 L396 200" stroke-width="2.5"/>
      <path d="M420 176 L420 200" stroke-width="2.5"/>
      <path d="M444 176 L444 200" stroke-width="2.5"/>
      <path d="M378 200 L462 200" stroke-width="2.5"/>
    </g>
  </g>

  <g font-family="'Courier New', monospace" fill="#33ff33" filter="url(#glow)" text-anchor="middle">
    <text x="450" y="266" font-size="34" letter-spacing="8">CABANA TERMINAL</text>
    <text x="450" y="290" font-size="13" letter-spacing="4" opacity="0.75">OPEN SOURCE // HARD ROCK // ANARQUIA</text>
    <text x="742" y="290" font-size="15" opacity="0.9">[root@cabana]#<tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
      _</tspan></text>
  </g>

  <rect width="900" height="300" fill="url(#scanlines)" opacity="0.5"/>
  <rect width="900" height="300" fill="url(#fade)"/>
  <rect width="900" height="300" fill="#33ff33" opacity="0">
    <animate attributeName="opacity" values="0;0.05;0;0.03;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
